<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador de emblemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;1,400&family=Open+Sans:wght@400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #f7edee;
    --p: #417b65; --l: #6cb89c; --d: #264338;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --ease-in-out: cubic-bezier(.77, 0, .175, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: 24px 16px;
    background: #2c3a2f url("assets/fondo.jpg") center / cover no-repeat fixed;
    font-family: "Open Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .stage {
    width: min(720px, 100%);
    min-width: 0;
    container-type: inline-size;
  }

  /* todo lo que se ajusta desde el panel entra por las --k-* */
  .panel {
    --tile: var(--k-tile, 32cqw);
    --off: var(--k-off, 31cqw);
    --side: var(--k-side, .666);
    --sideOp: var(--k-sideOp, 1);
    --sideBlur: var(--k-sideBlur, 0px);
    --tileR: var(--k-tileR, 1.9cqw);
    --embSize: var(--k-embSize, 64%);
    --thumb: var(--k-thumb, 6.4cqw);
    --tgap: var(--k-tgap, .8cqw);
    --thumbR: var(--k-thumbR, .22);
    --dockOff: var(--k-dockOff, .9);
    --sw: var(--k-sw, 1.8cqw);
    --sgap: var(--k-sgap, 1.1cqw);
    --glassTint: var(--k-glassTint, 16%);
    --glassWhite: var(--k-glassWhite, .26);
    --glassBlur: var(--k-glassBlur, 26px);
    --padT: 6.5cqw; --padB: 6.5cqw;
    --radius: 9cqw;

    position: relative;
    display: flex;
    flex-direction: column;
    border-radius: var(--radius);
    padding: var(--padT) 0 var(--padB);
    background:
      linear-gradient(180deg, rgb(255 255 255 / var(--glassWhite)), rgb(255 255 255 / calc(var(--glassWhite) * .3)) 60%),
      color-mix(in oklab, var(--d) var(--glassTint), transparent);
    -webkit-backdrop-filter: blur(var(--glassBlur)) saturate(150%);
    backdrop-filter: blur(var(--glassBlur)) saturate(150%);
    border: 1px solid rgb(255 255 255 / .38);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / .55),
      inset 0 -1px 0 rgb(255 255 255 / .12),
      0 40px 90px -30px rgb(0 0 0 / .45);
    overflow: hidden;
    touch-action: pan-y;
  }
  /* vidrio crema: translúcido o sólido; la interfaz pasa a profundo para que se lea */
  .panel { --ui: #fff; }
  .panel[data-glass="crema"] {
    --ui: var(--d);
    background:
      linear-gradient(180deg, rgb(247 237 238 / calc(var(--glassWhite) * .6 + .35)), rgb(247 237 238 / calc(var(--glassWhite) * .4 + .2)) 60%),
      color-mix(in oklab, var(--d) var(--glassTint), transparent);
    border-color: rgb(247 237 238 / .6);
  }
  .panel[data-glass="crema-solido"] {
    --ui: var(--d);
    background: color-mix(in oklab, var(--d) calc(var(--glassTint) * .35), var(--crema));
    -webkit-backdrop-filter: none; backdrop-filter: none;
    border-color: rgb(247 237 238 / .8);
  }
  @container (max-width: 520px) {
    .panel {
      --padT: 9cqw; --padB: 8cqw;
      --tile: 66cqw;
      --thumb: 13cqw; --tgap: 3cqw;
      --sw: 6cqw; --sgap: 2.6cqw;
      --radius: 10cqw;
    }
  }

  /* ---------- carrusel ---------- */
  .carousel { position: relative; order: 1; height: var(--tile); perspective: 1400px; user-select: none; cursor: grab; touch-action: pan-y; }
  .carousel.dragging { cursor: grabbing; }
  .card {
    --o: 0; --s: 1;
    position: absolute; left: 50%; top: 0;
    width: var(--tile); height: var(--tile);
    transform: translateX(-50%);
    will-change: transform, opacity;
  }
  .card-in {
    position: absolute; inset: 0;
    border-radius: calc(var(--tileR) / var(--s));
    transition: transform .5s cubic-bezier(.2, .8, .2, 1), background-color .4s, box-shadow .4s;
    transform-style: preserve-3d;
    overflow: hidden;
  }
  .panel[data-card="solido"]   .card-in { background: var(--cardBg, var(--d)); }
  .panel[data-card="vidrio"]   .card-in { background: rgb(255 255 255 / .14); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .32); }
  .panel[data-card="contorno"] .card-in { box-shadow: inset 0 0 0 calc(.12cqw / var(--s)) rgb(255 255 255 / .55); }
  .panel[data-shadow="1"][data-card="solido"] .card-in,
  .panel[data-shadow="1"][data-card="vidrio"] .card-in { box-shadow: 0 1.6cqw 3cqw -1.4cqw rgb(0 0 0 / .35); }
  .panel[data-shadow="1"][data-card="vidrio"] .card-in { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .32), 0 1.6cqw 3cqw -1.4cqw rgb(0 0 0 / .3); }
  .panel[data-shadow="1"][data-card="ninguno"] .emb,
  .panel[data-shadow="1"][data-card="contorno"] .emb { filter: drop-shadow(0 .5cqw 1cqw rgb(0 0 0 / .28)); }
  .card-in::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 60% at var(--gx, 50%) var(--gy, 0%), rgb(255 255 255 / .14), transparent 70%);
    opacity: 0; transition: opacity .4s;
  }
  .panel[data-card="solido"] .card.center .card-in:hover::before,
  .panel[data-card="vidrio"] .card.center .card-in:hover::before { opacity: 1; }
  .emb {
    position: absolute; left: 50%; top: 43%;
    width: var(--embSize);
    translate: -50% -50%;
    fill: var(--emb, var(--l));
    overflow: visible;
    transition: fill .3s, top .4s;
  }
  .panel[data-caption="oculto"] .emb { top: 50%; }
  .card.center .emb { animation: pop .35s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes pop { from { scale: .96; opacity: .6; } to { scale: 1; opacity: 1; } }
  .cap {
    position: absolute; left: 0; right: 0; bottom: 6.5%;
    text-align: center;
    color: var(--crema);
    opacity: 0;
    transition: opacity .3s, color .3s;
  }
  .panel[data-caption="emblema"] .cap { color: var(--emb, var(--l)); }
  .panel[data-caption="oculto"] .cap { display: none; }
  .card.center .cap { opacity: 1; transition-delay: .25s; }
  .cap .n { display: block; font-family: "Space Mono", monospace; font-size: 1.9cqw; letter-spacing: .02em; }
  .cap em { display: block; margin-top: .6cqw; font-family: "Averia Serif Libre", serif; font-style: italic; font-size: 1.8cqw; opacity: .7; }
  .card.center .cap .n, .card.center .cap em { animation: up .45s cubic-bezier(.2, .8, .2, 1) both; }
  .card.center .cap em { animation-delay: .07s; }
  @keyframes up { from { transform: translateY(1cqw); opacity: 0; } to { transform: none; } }
  @container (max-width: 520px) {
    .cap .n { font-size: 3.4cqw; }
    .cap em { font-size: 3.2cqw; margin-top: 1cqw; }
  }
  .nav { order: 2; display: flex; justify-content: center; gap: 1.2cqw; margin-top: 2cqw; }
  .arrow {
    position: relative;
    width: 5.6cqw; height: 5.6cqw;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--ui);
    transition: background .25s, transform .1s ease-out, color .3s;
    z-index: 20;
  }
  .arrow svg { width: 52%; height: 52%; }
  .arrow:hover { background: color-mix(in oklab, var(--ui) 14%, transparent); }
  .arrow:active { transform: scale(.92); }
  @container (max-width: 520px) { .nav { gap: 3cqw; margin-top: 3cqw; } .arrow { width: 10cqw; height: 10cqw; } }

  /* ---------- dock ---------- */
  .dock {
    order: 3;
    position: relative;
    overflow: hidden;
    margin-top: 2.4cqw;
    padding: .4cqw 0 2.2cqw;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  }
  .dock-track { display: flex; align-items: flex-end; gap: var(--tgap); width: max-content; will-change: transform; }
  .panel[data-dock-show="0"] .dock { display: none; }
  .thumb {
    flex: none; position: relative;
    width: var(--thumb); height: var(--thumb);
    border-radius: calc(var(--thumb) * var(--thumbR));
    transition: background-color .3s, box-shadow .3s;
  }
  .thumb svg { position: absolute; inset: 14%; width: 72%; height: 72%; fill: var(--dockEmb, var(--emb, var(--l))); transition: fill .3s, opacity .3s; }
  .thumb:not(.on) svg { opacity: var(--dockOff); }
  .panel[data-dock="solido"] .thumb { background: var(--d); }
  .panel[data-dock="vidrio"] .thumb { background: rgb(255 255 255 / .14); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .28); }
  .panel[data-dock="ninguno"] .thumb svg { inset: 4%; width: 92%; height: 92%; }
  .panel[data-dock-active="anillo"] .thumb.on { box-shadow: 0 0 0 .2cqw var(--ui); }
  .panel[data-dock-active="relleno"] .thumb.on { background: var(--p); }
  .panel[data-dock-active="relleno"] .thumb.on svg { fill: var(--crema); }
  .thumb::after {
    content: ""; position: absolute; left: 50%; bottom: -.9cqw;
    width: .4cqw; height: .4cqw; border-radius: 50%;
    background: var(--ui); translate: -50% 0; opacity: 0; transition: opacity .3s;
  }
  .panel[data-dock-active="punto"] .thumb.on::after { opacity: .9; }
  @container (max-width: 520px) {
    .dock { margin-top: 4cqw; padding-bottom: 4cqw; }
    .panel[data-dock-active="anillo"] .thumb.on { box-shadow: 0 0 0 .6cqw var(--ui); }
    .thumb::after { bottom: -2cqw; width: 1.2cqw; height: 1.2cqw; }
  }

  /* ---------- selector de triadas ---------- */
  .swatches {
    order: 4;
    position: relative;
    align-self: center;
    display: flex; align-items: center; gap: var(--sgap);
    margin-top: 1.6cqw;
  }
  .panel[data-sw-pos="arriba"] .swatches { order: 0; margin: 0 0 3cqw; }
  .panel[data-sw-pos="esquina"] .swatches { position: absolute; top: calc(var(--padT) * .5 - var(--sw) / 2); right: 8cqw; margin: 0; z-index: 30; }
  .sw {
    position: relative; flex: none;
    width: var(--sw); height: var(--sw);
    border-radius: 999px;
    background: var(--c1);
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22);
    outline: .14cqw solid transparent; outline-offset: .28cqw;
    transition: width .4s cubic-bezier(.2, .8, .2, 1), transform .1s ease-out, outline-color .3s;
  }
  .panel[data-sw-shape="pastilla"] .sw { width: calc(var(--sw) * 3); }
  .panel[data-sw-fill="triada"] .sw { background: conic-gradient(from -90deg, var(--c1) 0 120deg, var(--c2) 0 240deg, var(--c3) 0); }
  .panel[data-sw-fill="triada"][data-sw-shape="pastilla"] .sw { background: linear-gradient(90deg, var(--c3) 0 33.4%, var(--c1) 0 66.7%, var(--c2) 0); }
  .sw:hover { transform: translateY(-.2cqw); }
  .sw:active { transform: scale(.88); }
  .panel[data-sw-active="anillo"] .sw.on { outline-color: var(--ui); }
  .panel[data-sw-active="escala"] .sw.on { transform: scale(1.4); }
  .panel[data-sw-active="escala"] .sw.on:active { transform: scale(1.25); }
  .panel[data-sw-active="expandir"] .sw.on { width: calc(var(--sw) * 2.6); }
  .panel[data-sw-active="expandir"][data-sw-shape="pastilla"] .sw.on { width: calc(var(--sw) * 4.6); }
  .sw::after {
    content: ""; position: absolute; left: 50%; top: calc(100% + var(--sw) * .35);
    width: max(4px, calc(var(--sw) * .22)); aspect-ratio: 1; border-radius: 50%;
    background: var(--ui); translate: -50% 0; opacity: 0; transition: opacity .3s;
  }
  .panel[data-sw-active="punto"] .sw.on::after { opacity: .95; }
  .famname {
    position: absolute; left: 100%; top: 50%; translate: 0 -50%;
    margin-left: 1.4cqw;
    font-family: "Space Mono", monospace; font-size: max(10px, .95cqw);
    color: var(--ui); opacity: .85; white-space: nowrap;
    display: none;
  }
  .panel[data-sw-name="1"] .famname { display: block; }
  .panel[data-sw-pos="esquina"] .famname { left: auto; right: 100%; margin: 0 1.4cqw 0 0; }
  @container (max-width: 520px) {
    .swatches { margin-top: 3cqw; }
    .famname { position: static; translate: none; margin-left: 1cqw; font-size: 3cqw; }
  }


  /* ---------- entrada: se ve una vez, cuando la pieza llega a pantalla ---------- */
  .panel.pre { opacity: 0; transform: translateY(24px) scale(.98); }
  .panel.intro { transition: opacity .6s var(--ease-out), transform .8s var(--ease-out); }
  .panel.pre .carousel { opacity: 0; transform: translateY(14px); }
  .panel.intro .carousel { transition: opacity .6s var(--ease-out) .12s, transform .8s var(--ease-out) .12s; }
  .panel.pre .arrow { opacity: 0; }
  .panel.intro .arrow { transition: opacity .5s var(--ease-out) .55s; }
  .panel.pre .thumb, .panel.pre .sw { opacity: 0; transform: translateY(10px); }
  .panel.intro .thumb, .panel.intro .sw {
    transition: opacity .45s var(--ease-out) calc(.3s + var(--i) * 30ms), transform .6s var(--ease-out) calc(.3s + var(--i) * 30ms);
  }

  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- panel de ajustes (oculto; se abre con ?ajustes) ---------- */
  body.tw-open { padding-right: 336px; }
  .tw {
    position: fixed; top: 12px; right: 12px; bottom: 12px; z-index: 100;
    width: 312px;
    display: flex; flex-direction: column;
    background: rgb(20 26 22 / .82);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    color: #eeeae2;
    border: 1px solid rgb(255 255 255 / .12);
    border-radius: 16px;
    font: 12px/1.35 "Open Sans", system-ui, sans-serif;
    box-shadow: 0 20px 60px -20px rgb(0 0 0 / .6);
  }
  .tw-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 14px; border-bottom: 1px solid rgb(255 255 255 / .08); }
  .tw-head strong { font-weight: 700; font-size: 13px; flex: 1; }
  .tw-body { overflow-y: auto; padding: 4px 14px 14px; scrollbar-width: thin; }
  .tw-presets { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0 4px; }
  .tw-presets span { width: 100%; opacity: .6; font-size: 11px; }
  .tw details { border-top: 1px solid rgb(255 255 255 / .08); padding: 8px 0 4px; }
  .tw details:first-of-type { border-top: 0; }
  .tw summary { cursor: pointer; font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .9; padding: 4px 0 6px; list-style: none; }
  .tw summary::-webkit-details-marker { display: none; }
  .tw summary::after { content: "−"; float: right; opacity: .5; }
  .tw details:not([open]) summary::after { content: "+"; }
  .tw-row { padding: 6px 0; }
  .tw-lab { display: flex; justify-content: space-between; margin-bottom: 5px; opacity: .85; }
  .tw-lab output { font-family: "Space Mono", monospace; font-size: 11px; opacity: .8; }
  .tw input[type=range] { width: 100%; accent-color: #f7edee; margin: 0; }
  .tw-seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .tw-btn, .tw-seg button {
    padding: 5px 9px; border-radius: 999px;
    background: rgb(255 255 255 / .07); color: #eeeae2;
    font-size: 11.5px; transition: background .2s, color .2s;
  }
  .tw-btn:hover, .tw-seg button:hover { background: rgb(255 255 255 / .14); }
  .tw-seg button.on { background: #f7edee; color: #1b211d; font-weight: 600; }
  .tw-toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .tw-toggle input { accent-color: #f7edee; width: 16px; height: 16px; }
  .tw-foot { display: flex; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid rgb(255 255 255 / .08); }
  .tw-foot .tw-btn { flex: 1; text-align: center; }
  .tw-open-btn {
    position: fixed; right: 16px; bottom: 16px; z-index: 100;
    padding: 9px 14px; border-radius: 999px;
    background: rgb(20 26 22 / .82); color: #eeeae2;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border: 1px solid rgb(255 255 255 / .14);
    font: 600 12px "Open Sans", sans-serif;
    display: none;
  }
  body:not(.tw-open) .tw { display: none; }
  body:not(.tw-open) .tw-open-btn { display: block; }
  @media (max-width: 1000px) {
    body.tw-open { padding-right: 16px; padding-bottom: calc(46vh + 16px); }
    .tw { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 46vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0s !important; }
  }
</style>
<script>if (/[?&]ajustes\b/.test(location.search)) document.documentElement.classList.add("con-ajustes");</script>
<style>html:not(.con-ajustes) .tw, html:not(.con-ajustes) .tw-open-btn { display: none !important; }</style>
</head>
<body class="tw-open">
<main class="stage" id="stage">
  <section class="panel pre" id="panel" aria-roledescription="carrusel" aria-label="Sistema de emblemas de E&D Herbs">
    <div class="carousel" id="car"></div>
    <div class="nav">
      <button class="arrow prev" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
      <button class="arrow next" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
    </div>
    <div class="dock" id="dock" role="tablist" aria-label="Emblemas"><div class="dock-track" id="track"></div></div>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Triada de color"><span class="famname" id="famname"></span></div>
    <p class="sr" aria-live="polite" id="live"></p>
  </section>
</main>

<aside class="tw" id="tw" aria-label="Ajustes">
  <div class="tw-head"><strong>Ajustes</strong><button class="tw-btn" id="tw-close">Ocultar</button></div>
  <div class="tw-body" id="tw-body"></div>
  <div class="tw-foot">
    <button class="tw-btn" id="tw-replay">Repetir entrada</button>
    <button class="tw-btn" id="tw-reset">Restablecer</button>
    <button class="tw-btn" id="tw-copy">Copiar ajustes</button>
  </div>
</aside>

// Triadas de la colección Marca (principal / luminoso / profundo)
const TRIADAS = [
  ["Verde",     "#417b65", "#6cb89c", "#264338"],
  ["Lavanda",   "#de9ce3", "#f7cffa", "#936e96"],
  ["Terracota", "#df5425", "#fbb49c", "#8b361b"],
  ["Ocre",      "#b58735", "#fedca2", "#7e612e"],
  ["Azul",      "#6e96de", "#bad3ff", "#46659d"],
  ["Violeta",   "#9d7fe0", "#cdb9f8", "#604796"],
];

const items = DATA.explorador;
const N = items.length;
const $ = (s) => document.querySelector(s);
const stage = $("#stage"), car = $("#car"), dock = $("#dock"), swatches = $("#swatches"), panel = $("#panel"), live = $("#live");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const svg = (slug, cls) => {
  const p = DATA.emb[slug].map(([d, r]) => `<path d="${d}"${r ? ` fill-rule="${r}"` : ""}/>`).join("");
  return `<svg class="${cls || ""}" viewBox="110 0 1080 1080" aria-hidden="true">${p}</svg>`;
};

// ---------- armado ----------
const cards = items.map((it, i) => {
  const b = document.createElement("button");
  b.className = "card";
  b.tabIndex = -1;
  b.setAttribute("aria-label", `${it.name}, ${it.sci}`);
  b.innerHTML = `<div class="card-in">${svg(it.slug, "emb")}<div class="cap"><span class="n">${it.n} - ${it.name}</span><em>${it.sci}</em></div></div>`;
  b.addEventListener("click", () => { if (!dragged) { stopAuto(); go(i); } });
  car.appendChild(b);
  return b;
});

// el dock lleva tres copias seguidas: así la tira da la vuelta sin salto
const track = $("#track");
const thumbs = [0, 1, 2].flatMap((copy) => items.map((it, i) => {
  const b = document.createElement("button");
  b.className = "thumb";
  b.setAttribute("role", "tab");
  b.setAttribute("aria-label", it.name);
  if (copy !== 1) { b.tabIndex = -1; b.setAttribute("aria-hidden", "true"); }
  b.innerHTML = svg(it.slug);
  b.addEventListener("click", () => { stopAuto(); go(i); });
  b.style.setProperty("--i", i);
  track.appendChild(b);
  return b;
}));

const swEls = TRIADAS.map(([name, p, l, d], i) => {
  const b = document.createElement("button");
  b.className = "sw";
  b.style.setProperty("--c1", p);
  b.style.setProperty("--c2", l);
  b.style.setProperty("--c3", d);
  b.title = name;
  b.setAttribute("role", "radio");
  b.setAttribute("aria-label", name);
  b.addEventListener("click", () => setTriada(i));
  b.style.setProperty("--i", N + i);
  swatches.insertBefore(b, $("#famname"));
  return b;
});

// ---------- carrusel: una posición continua movida por un resorte ----------
// pos está en unidades de tarjeta y no se envuelve: el aro se resuelve al dibujar.
// Resorte al estilo Apple: respuesta (s) y amortiguación (1 = sin rebote).
const spring = { pos: 1, vel: 0, target: 1, response: .42, damping: 1 };
let running = false, dragging = false, dragged = false, last = 0, cur = -1;
let L = { off: 300, side: .666, sideOp: 1, sideBlur: 0 };
const mod = (i) => ((i % N) + N) % N;
const wrapF = (o) => { const h = N / 2; return ((((o + h) % N) + N) % N) - h; };
const pv = (name) => parseFloat(getComputedStyle(panel).getPropertyValue(name));

function readLayout() {
  L = {
    off: pv("--off") / 100 * stage.clientWidth,
    side: pv("--side"),
    sideOp: pv("--sideOp"),
    sideBlur: pv("--sideBlur") || 0,
    // medidas de layout con decimales (offsetLeft redondea y el error se acumula en la tira)
    thumbW: parseFloat(getComputedStyle(thumbs[0]).width),
    pitch: parseFloat(getComputedStyle(thumbs[0]).width) + parseFloat(getComputedStyle(track).columnGap),
    dockW: parseFloat(getComputedStyle(dock).width),
  };
}

function render() {
  cards.forEach((c, k) => {
    const o = wrapF(k - spring.pos);
    const a = Math.abs(o);
    const s = 1 - (1 - L.side) * Math.min(a, 1);
    const op = a <= 1 ? 1 - (1 - L.sideOp) * a : a < 2 ? L.sideOp * (2 - a) : 0;
    c.style.transform = `translateX(-50%) translateX(${(o * L.off).toFixed(2)}px) scale(${s.toFixed(4)})`;
    c.style.opacity = op.toFixed(3);
    c.style.filter = L.sideBlur > 0 && a > .01 ? `blur(${(L.sideBlur * Math.min(a, 1)).toFixed(2)}px)` : "";
    c.style.visibility = op < .01 ? "hidden" : "visible";
    c.style.zIndex = 100 - Math.round(a * 10);
    c.style.setProperty("--s", s.toFixed(4));
    c.setAttribute("aria-hidden", a > .5);
    const isC = a < .5, wasC = c.classList.contains("center");
    c.classList.toggle("center", isC);
    if (isC && !wasC) { const e = c.querySelector(".emb"); e.style.animation = "none"; e.offsetWidth; e.style.animation = ""; }
  });
  // la tira sigue al mismo resorte que el carrusel: la elegida siempre queda en el medio
  const c = N + ((spring.pos % N) + N) % N;
  track.style.transform = `translateX(${(L.dockW / 2 - c * L.pitch - L.thumbW / 2).toFixed(2)}px)`;
  const idx = mod(Math.round(spring.pos));
  if (idx !== cur) {
    cur = idx;
    thumbs.forEach((t, k) => { const on = k % N === cur; t.classList.toggle("on", on); t.setAttribute("aria-selected", on); });
    live.textContent = `${items[cur].name}, ${items[cur].sci}`;
  }
}

function tick(t) {
  if (dragging) { running = false; return; }
  const dt = Math.min(.034, (t - last) / 1000 || .016);
  last = t;
  const k = Math.pow(2 * Math.PI / spring.response, 2);
  const c = 4 * Math.PI * spring.damping / spring.response;
  const steps = 6, h = dt / steps;
  for (let i = 0; i < steps; i++) {
    const acc = -k * (spring.pos - spring.target) - c * spring.vel;
    spring.vel += acc * h;
    spring.pos += spring.vel * h;
  }
  if (Math.abs(spring.pos - spring.target) < .0004 && Math.abs(spring.vel) < .002) {
    spring.pos = spring.target; spring.vel = 0; running = false; render(); return;
  }
  render();
  requestAnimationFrame(tick);
}
// siempre desde el valor actual y conservando la velocidad: se puede interrumpir en cualquier momento
function animateTo(target, { response, damping, velocity } = {}) {
  spring.target = target;
  spring.response = response ?? S.resp;
  spring.damping = damping ?? (1 - S.navBounce);
  if (velocity !== undefined) spring.vel = velocity;
  if (reduce) { spring.pos = target; spring.vel = 0; render(); return; }
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
}
// ir a un índice por el camino más corto del aro; se acumula si hacés clics rápidos
function go(i) {
  const base = Math.round(spring.target);
  animateTo(base + wrapF(mod(i) - mod(base)));
}
const step = (d) => animateTo(Math.round(spring.target) + d);

$("#prev").addEventListener("click", () => { stopAuto(); step(-1); });
$("#next").addEventListener("click", () => { stopAuto(); step(1); });
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest(".tw")) return;
  if (e.key === "ArrowRight") { stopAuto(); step(1); }
  if (e.key === "ArrowLeft") { stopAuto(); step(-1); }
});
new ResizeObserver(() => { readLayout(); render(); }).observe(panel);

// ---------- arrastre 1:1 con impulso ----------
let drag = null;
car.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || e.target.closest(".arrow")) return;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, pos0: spring.pos, hist: [], active: false };
});
car.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.active) {
    // umbral chico antes de decidir que es un arrastre horizontal
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
      drag.active = dragging = true;
      stopAuto();
      try { car.setPointerCapture(e.pointerId); } catch (err) {}
      car.classList.add("dragging");
      drag.x0 = e.clientX;          // se agarra desde donde está, sin salto
      drag.pos0 = spring.pos;       // y desde el valor que se ve en pantalla
      spring.vel = 0;
    } else if (Math.abs(dy) > 10) drag = null;
    return;
  }
  const now = performance.now();
  drag.hist.push([e.clientX, now]);
  while (drag.hist.length > 2 && now - drag.hist[0][1] > 100) drag.hist.shift();
  spring.pos = drag.pos0 - (e.clientX - drag.x0) / L.off;
  render();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.active) {
    const h = drag.hist, n = h.length;
    let v = 0;
    if (n > 1 && performance.now() - h[n - 1][1] < 80) v = (h[n - 1][0] - h[0][0]) / ((h[n - 1][1] - h[0][1]) / 1000 || 1);
    dragging = false;
    car.classList.remove("dragging");
    // proyección de Apple: adónde iría con ese impulso, y de ahí la tarjeta más cercana
    const projected = spring.pos - (v / 1000) * .99 / (1 - .99) / L.off;
    const r = Math.round(spring.pos);
    const target = Math.max(r - 3, Math.min(r + 3, Math.round(projected)));
    animateTo(target, { damping: 1 - S.flickBounce, velocity: -v / L.off });
    dragged = true;
    setTimeout(() => (dragged = false), 0);
  }
  drag = null;
}
car.addEventListener("pointerup", endDrag);
car.addEventListener("pointercancel", endDrag);

car.addEventListener("pointermove", (e) => {
  if (reduce || dragging || !S.tilt || e.pointerType !== "mouse") return;
  const c = cards[cur].querySelector(".card-in");
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) { c.style.transform = ""; return; }
  c.style.transform = `rotateY(${(x - .5) * 10}deg) rotateX(${(.5 - y) * 10}deg)`;
  c.style.setProperty("--gx", `${x * 100}%`);
  c.style.setProperty("--gy", `${y * 100}%`);
});
car.addEventListener("pointerleave", () => cards.forEach((c) => (c.querySelector(".card-in").style.transform = "")));


// ---------- color ----------
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = (a) => "#" + a.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
const root = document.documentElement;
const now = { "--p": TRIADAS[0][1], "--l": TRIADAS[0][2], "--d": TRIADAS[0][3] };
let raf, fam = 0;
function tween(target, dur = 700) {
  cancelAnimationFrame(raf);
  const from = Object.fromEntries(Object.keys(target).map((k) => [k, hex2rgb(now[k])]));
  const t0 = performance.now();
  const step = (t) => {
    const x = reduce ? 1 : Math.min(1, (t - t0) / dur);
    const e = x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    for (const k in target) {
      const b = hex2rgb(target[k]);
      now[k] = rgb2hex(from[k].map((v, i) => v + (b[i] - v) * e));
      root.style.setProperty(k, now[k]);
    }
    if (x < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function setTriada(i, user = true) {
  if (user) stopAuto();
  fam = i;
  const [name, p, l, d] = TRIADAS[i];
  tween({ "--p": p, "--l": l, "--d": d });
  swEls.forEach((b, k) => { b.classList.toggle("on", k === i); b.setAttribute("aria-checked", k === i); });
  $("#famname").textContent = name;
}

// ---------- autoplay ----------
let auto = null, stopped = false, introDone = false;
function startAuto() {
  clearInterval(auto);
  if (!introDone) return;
  auto = (!reduce && S.auto && !stopped) ? setInterval(() => step(1), S.autoT * 1000) : null;
}
function stopAuto() { stopped = true; clearInterval(auto); auto = null; }

// ---------- ajustes ----------
// valores por defecto
const DEFAULTS = {
  card: "ninguno", cardTone: "p", emb: "p", caption: "emblema", shadow: false, tilt: false,
  tile: 58, embSize: 79, off: 46, side: .48, sideOp: 0, sideBlur: 0, tileR: 8,
  resp: .42, navBounce: 0, flickBounce: .2, auto: true, autoT: 3.8, intro: true,
  dockShow: true, dock: "ninguno", dockEmb: "carrusel", dockActive: "punto", thumb: 9, tgap: 2.2, thumbR: .19, dockOff: .9,
  swShape: "circulo", swFill: "principal", swActive: "punto", swPos: "abajo", sw: 3.6, sgap: 1.45, swName: false,
  glass: "crema-solido", glassTint: 0, glassWhite: .5, glassBlur: 50,
};
const PRESETS = {
  "Elegido": {},
  "Tarjeta sólida": { card: "solido", cardTone: "d", emb: "l", caption: "crema", side: .63, sideOp: .8, dockEmb: "crema", glass: "blanco", glassTint: 24 },
  "Vidrio": { card: "vidrio", emb: "crema", caption: "crema", side: .63, sideOp: .75, dockEmb: "crema", glass: "blanco", glassTint: 24 },
  "Contorno": { card: "contorno", emb: "crema", caption: "crema", side: .63, sideOp: .6, dockEmb: "crema", swFill: "triada", glass: "blanco", glassTint: 24 },
};
const SCHEMA = [
  ["Carrusel", [
    ["card", "Fondo de tarjeta", "seg", [["solido", "Sólido"], ["vidrio", "Vidrio"], ["contorno", "Contorno"], ["ninguno", "Sin fondo"]]],
    ["cardTone", "Color del fondo sólido", "seg", [["d", "Profundo"], ["p", "Principal"], ["l", "Luminoso"]]],
    ["emb", "Color del emblema", "seg", [["l", "Luminoso"], ["p", "Principal"], ["d", "Profundo"], ["crema", "Crema"]]],
    ["caption", "Nombre", "seg", [["crema", "Crema"], ["emblema", "Color"], ["oculto", "Oculto"]]],
    ["tile", "Tamaño", "range", 40, 80, .5, "cqw"],
    ["embSize", "Tamaño del emblema", "range", 40, 92, 1, "%"],
    ["off", "Separación", "range", 30, 75, .5, "cqw"],
    ["side", "Escala de los costados", "range", .4, .95, .01, ""],
    ["sideOp", "Opacidad de los costados", "range", 0, 1, .05, ""],
    ["sideBlur", "Desenfoque de los costados", "range", 0, 10, .5, "px"],
    ["tileR", "Radio", "range", 0, 14, .1, "cqw"],
    ["shadow", "Sombra", "toggle"],
    ["tilt", "Inclinación con el mouse", "toggle"],
    ["resp", "Respuesta del resorte", "range", .2, .9, .01, "s"],
    ["navBounce", "Rebote al elegir", "range", 0, .5, .01, ""],
    ["flickBounce", "Rebote al tirar", "range", 0, .5, .01, ""],
    ["intro", "Animación de entrada", "toggle"],
    ["auto", "Pasa solo", "toggle"],
    ["autoT", "Cada", "range", 2, 8, .2, "s"],
  ]],
  ["Dock", [
    ["dockShow", "Mostrar", "toggle"],
    ["dock", "Fondo", "seg", [["solido", "Sólido"], ["vidrio", "Vidrio"], ["ninguno", "Sin fondo"]]],
    ["dockEmb", "Color de las plantas", "seg", [["crema", "Crema"], ["carrusel", "Como el carrusel"], ["l", "Luminoso"]]],
    ["dockActive", "Activo", "seg", [["anillo", "Anillo"], ["punto", "Punto"], ["relleno", "Relleno"]]],
    ["thumb", "Tamaño", "range", 5, 15, .1, "cqw"],
    ["tgap", "Separación", "range", 0, 5, .05, "cqw"],
    ["thumbR", "Redondez", "range", 0, .5, .01, ""],
    ["dockOff", "Opacidad de los inactivos", "range", .2, 1, .05, ""],
  ]],
  ["Triadas", [
    ["swShape", "Forma", "seg", [["circulo", "Círculo"], ["pastilla", "Pastilla"]]],
    ["swFill", "Muestra", "seg", [["principal", "Principal"], ["triada", "Los tres tonos"]]],
    ["swActive", "Activo", "seg", [["anillo", "Anillo"], ["escala", "Más grande"], ["punto", "Punto"], ["expandir", "Se estira"]]],
    ["swPos", "Posición", "seg", [["abajo", "Abajo"], ["arriba", "Arriba"], ["esquina", "Esquina"]]],
    ["sw", "Tamaño", "range", 1.5, 7, .05, "cqw"],
    ["sgap", "Separación", "range", .5, 5, .05, "cqw"],
    ["swName", "Nombre de la familia", "toggle"],
  ]],
  ["Vidrio", [
    ["glass", "Color del vidrio", "seg", [["blanco", "Blanco"], ["crema", "Crema"], ["crema-solido", "Crema sólido"]]],
    ["glassTint", "Tinte de la triada", "range", 0, 50, 1, "%"],
    ["glassWhite", "Blanco", "range", 0, .5, .01, ""],
    ["glassBlur", "Desenfoque", "range", 0, 50, 1, "px"],
  ]],
];
const VARS = { tile: "cqw", embSize: "%", off: "cqw", side: "", sideOp: "", sideBlur: "px", tileR: "cqw",
  thumb: "cqw", tgap: "cqw", thumbR: "", dockOff: "", sw: "cqw", sgap: "cqw", glassTint: "%", glassWhite: "", glassBlur: "px" };
const DATASET = { glass: "glass", card: "card", caption: "caption", dock: "dock", dockActive: "dockActive", swShape: "swShape",
  swFill: "swFill", swActive: "swActive", swPos: "swPos" };
const KEY = "edh-explorador-ajustes-v2";

let S = { ...DEFAULTS };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  for (const k in saved) if (k in DEFAULTS) S[k] = saved[k];   // descarta claves de versiones viejas
  if (S.dockActive === "escala") S.dockActive = "punto";
} catch (e) {}

function apply() {
  for (const k in VARS) stage.style.setProperty(`--k-${k}`, S[k] + VARS[k]);
  for (const k in DATASET) panel.dataset[DATASET[k]] = S[k];
  panel.dataset.shadow = S.shadow ? 1 : 0;
  panel.dataset.dockShow = S.dockShow ? 1 : 0;
  panel.dataset.swName = S.swName ? 1 : 0;
  stage.style.setProperty("--emb", S.emb === "crema" ? "var(--crema)" : `var(--${S.emb})`);
  stage.style.setProperty("--cardBg", `var(--${S.cardTone})`);
  stage.style.setProperty("--dockEmb", S.dockEmb === "crema" ? "var(--crema)" : S.dockEmb === "carrusel" ? "var(--emb)" : "var(--l)");
  if (!S.tilt) cards.forEach((c) => (c.querySelector(".card-in").style.transform = ""));
  readLayout();
  render();
  startAuto();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

const body = $("#tw-body");
const fmt = (v, unit) => (Math.round(v * 100) / 100) + (unit === "×" ? "×" : unit);
function buildPanel() {
  let html = `<div class="tw-presets"><span>Puntos de partida</span>${Object.keys(PRESETS).map((p) => `<button class="tw-btn" data-preset="${p}">${p}</button>`).join("")}</div>`;
  for (const [sec, rows] of SCHEMA) {
    html += `<details open><summary>${sec}</summary>`;
    for (const [k, label, type, a, b, step, unit] of rows) {
      if (type === "seg") {
        html += `<div class="tw-row"><div class="tw-lab">${label}</div><div class="tw-seg" data-k="${k}">${a.map(([v, t]) => `<button data-v="${v}">${t}</button>`).join("")}</div></div>`;
      } else if (type === "range") {
        html += `<div class="tw-row"><div class="tw-lab">${label}<output data-o="${k}"></output></div><input type="range" data-k="${k}" min="${a}" max="${b}" step="${step}" data-unit="${unit}"></div>`;
      } else {
        html += `<label class="tw-row tw-toggle">${label}<input type="checkbox" data-k="${k}"></label>`;
      }
    }
    html += `</details>`;
  }
  body.innerHTML = html;
}
function syncPanel() {
  body.querySelectorAll(".tw-seg").forEach((g) => g.querySelectorAll("button").forEach((b) => b.classList.toggle("on", String(S[g.dataset.k]) === b.dataset.v)));
  body.querySelectorAll("input[type=range]").forEach((r) => { r.value = S[r.dataset.k]; body.querySelector(`[data-o="${r.dataset.k}"]`).textContent = fmt(S[r.dataset.k], r.dataset.unit); });
  body.querySelectorAll("input[type=checkbox]").forEach((c) => (c.checked = !!S[c.dataset.k]));
}
buildPanel();
body.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.preset) { S = { ...DEFAULTS, ...PRESETS[b.dataset.preset] }; stopped = false; }
  else if (b.closest(".tw-seg")) S[b.closest(".tw-seg").dataset.k] = b.dataset.v;
  else return;
  syncPanel(); apply();
});
body.addEventListener("input", (e) => {
  const t = e.target;
  if (!t.dataset.k) return;
  if (t.type === "range") { S[t.dataset.k] = parseFloat(t.value); body.querySelector(`[data-o="${t.dataset.k}"]`).textContent = fmt(S[t.dataset.k], t.dataset.unit); }
  if (t.type === "checkbox") { S[t.dataset.k] = t.checked; if (t.dataset.k === "auto") stopped = false; if (t.dataset.k === "intro" && t.checked) { apply(); runIntro(); return; } }
  apply();
});
$("#tw-reset").addEventListener("click", () => { S = { ...DEFAULTS }; stopped = false; syncPanel(); apply(); });
$("#tw-copy").addEventListener("click", async (e) => {
  const diff = Object.fromEntries(Object.entries(S).filter(([k, v]) => DEFAULTS[k] !== v));
  const txt = JSON.stringify({ ...diff }, null, 1);
  try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copiado"; }
  catch (err) { prompt("Copiá esto:", txt); }
  setTimeout(() => (e.target.textContent = "Copiar ajustes"), 1400);
});
const setOpen = (v) => { document.body.classList.toggle("tw-open", v); try { localStorage.setItem(KEY + "-open", v ? 1 : 0); } catch (e) {} };
$("#tw-close").addEventListener("click", () => setOpen(false));
$("#tw-open").addEventListener("click", () => setOpen(true));
try { if (localStorage.getItem(KEY + "-open") === "0") setOpen(false); } catch (e) {}

// ---------- entrada ----------
// 1) la pieza aparece en orden; 2) una pista de que se toca: el carrusel se asoma
// con el mismo resorte del arrastre y los círculos hacen una ola.
let introT = [];
function finishIntro() { introDone = true; startAuto(); }
function runIntro() {
  introT.forEach(clearTimeout); introT = [];
  stopAuto(); stopped = false; introDone = false;
  if (!S.intro) { panel.classList.remove("pre", "intro"); finishIntro(); return; }
  panel.classList.remove("intro");
  panel.classList.add("pre");
  panel.offsetWidth;
  panel.classList.add("intro");
  panel.classList.remove("pre");
  introT.push(setTimeout(() => { panel.classList.remove("intro"); hint(); }, 300 + (N + 6) * 30 + 650));
}
function hint() {
  if (reduce) return finishIntro();
  animateTo(spring.target, { velocity: 3.2, damping: .55, response: .5 });
  swEls.forEach((b, i) => b.animate(
    [{ transform: "translateY(0)" }, { transform: "translateY(-35%)" }, { transform: "translateY(0)" }],
    { duration: 520, delay: 380 + i * 70, easing: "cubic-bezier(.77, 0, .175, 1)", composite: "add" }));
  introT.push(setTimeout(finishIntro, 1900));
}
$("#tw-replay").addEventListener("click", runIntro);

syncPanel();
setTriada(0, false);
apply();
if (!S.intro) runIntro();
else if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver((es) => {
    if (es.some((e) => e.isIntersecting)) { io.disconnect(); runIntro(); }
  }, { threshold: .35 });
  io.observe(panel);
} else runIntro();
</script>
